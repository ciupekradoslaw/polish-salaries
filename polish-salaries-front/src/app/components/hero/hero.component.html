<section class="flex flex-col gap-4 text-center bg-primary py-4">
  <h1 class="text-4xl font-display text-white">
    Zarobki w Polsce
  </h1>

  <app-stats-bar></app-stats-bar>

  <div>
    <input
      #inputRef
      type="text"
      placeholder="np. prezydent, sędzia, nauczyciel"
      class="w-full max-w-xl px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/50 border border-white/20 focus:outline-none focus:ring-2 focus:ring-accent transition"
      (input)="onInput(inputRef.value)"
    />
  </div>
</section>
