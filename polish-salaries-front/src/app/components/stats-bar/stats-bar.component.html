<section class="py-4 max-w-4xl mx-auto">
  <div class="grid grid-cols-2 gap-4 -mt-10">
    @for (stat of stats(); track stat) {
      <div
        class=" bg-white border border-white/20 rounded-2xl p-5 text-center shadow-lg"
      >
        <div class="text-lg uppercase text-text-muted tracking-wider">{{ stat.label }}</div>
        <div class="text-xl font-semibold text-primary">
          {{ stat.value }}
        </div>
      </div>
    }
  </div>
</section>
