<div class="min-h-screen flex flex-col bg-primary">
  <div class="flex flex-1 items-center justify-center p-12">
    <div class="w-full max-w-sm rounded-2xl p-8 bg-surface-overlay border border-accent-subtle">
      <div
        class="size-11 rounded-full flex items-center justify-center mb-5 bg-accent-subtle border border-accent-subtle text-accent">
        <mat-icon class="text-accent">lock</mat-icon>
      </div>

      <h2 class="text-xl font-medium text-white mb-1">{{ 'app.admin.login.administrationPanel' | translate }}</h2>
      <p class="text-sm text-white/45 mb-7">{{ 'app.admin.login.loginToManageYourData' | translate }}</p>

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Login</mat-label>
          <input matInput type="email" [formField]="loginForm.login" placeholder="admin@ilezarabia.pl"/>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input matInput type="password" [formField]="loginForm.password" placeholder="••••••••"/>
        </mat-form-field>

        <button mat-flat-button type="submit" class="w-full h-11 font-medium">
          Zaloguj się
        </button>
      </form>

      <mat-divider/>

      <a routerLink="/"
         class="flex items-center justify-center gap-1 text-sm text-white/35 hover:text-white/65 transition-colors">
        <mat-icon class="text-base">arrow_back</mat-icon>
        Wróć do strony głównej
      </a>
    </div>
  </div>
</div>
